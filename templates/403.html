{% extends 'base.html' %}

{% block title %}Access Denied - FinTrack{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="empty-state">
      <div class="empty-state-icon bg-danger-subtle text-danger" style="width: 80px; height: 80px; font-size: 2.2rem;">
        <i class="bi bi-shield-x"></i>
      </div>
      <h1 class="display-6 fw-bold text-dark mt-2 mb-2">403 - Permission Denied</h1>
      <p class="text-muted mb-4">
        You do not have permission to access or modify this resource. User financial data is strictly isolated.
      </p>
      <a href="{% url 'dashboard' %}" class="btn btn-primary">
        <i class="bi bi-house-door me-1"></i> Return to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
