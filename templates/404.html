{% extends 'base.html' %}

{% block title %}Page Not Found - FinTrack{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="empty-state">
      <div class="empty-state-icon bg-warning-subtle text-warning" style="width: 80px; height: 80px; font-size: 2.2rem;">
        <i class="bi bi-question-circle"></i>
      </div>
      <h1 class="display-6 fw-bold text-dark mt-2 mb-2">404 - Page Not Found</h1>
      <p class="text-muted mb-4">
        The financial record or page you requested could not be found, or you may not have authorization to view it.
      </p>
      <a href="{% url 'dashboard' %}" class="btn btn-primary">
        <i class="bi bi-house-door me-1"></i> Return to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
